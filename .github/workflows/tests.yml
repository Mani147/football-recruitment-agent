name: Recruitment checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m pytest backend/tests -q
      - run: node --check backend/app/static/app.js
      - run: node --check backend/app/static/radar.js
      - run: node --check backend/app/static/compare.js
      - run: node --check backend/app/static/theme.js
      - run: node --test backend/tests/test_frontend.cjs
      - run: python -m backend.tests.integration_check
